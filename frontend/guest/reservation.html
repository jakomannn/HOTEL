<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание брони</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Венеция</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="rooms.html">Доступные номера</a>
            <a class="nav-link" href="my-reservations.html">Мои брони</a>
            <a class="nav-link" href="../login.html">Вход сотрудника</a>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Создание брони</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div id="noRoomMessage" class="alert alert-warning d-none">
        Сначала выберите свободный номер на нужные даты.
        <div class="mt-3">
            <a href="rooms.html" class="btn btn-primary">
                Перейти к доступным номерам
            </a>
        </div>
    </div>

    <div class="form-container" id="reservationFormContainer">
        <form id="reservationForm">
            <input type="hidden" id="roomId">

            <h4 class="mb-3">Данные гостя</h4>

            <div class="mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input type="text" id="firstName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input type="text" id="lastName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Телефон</label>
                <input
                    type="text"
                    id="phone"
                    class="form-control"
                    placeholder="+79990000000"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="passportNumber" class="form-label">Номер паспорта</label>
                <input type="text" id="passportNumber" class="form-control" required>
            </div>

            <hr>

            <h4 class="mb-3">Даты проживания</h4>

            <div class="mb-3">
                <label for="checkInDate" class="form-label">Дата заезда</label>
                <input type="date" id="checkInDate" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="checkOutDate" class="form-label">Дата выезда</label>
                <input type="date" id="checkOutDate" class="form-control" required>
            </div>

            <button
                type="submit"
                class="btn btn-primary"
                id="createReservationButton"
            >
                Забронировать
            </button>

            <a href="rooms.html" class="btn btn-secondary">
                Назад к номерам
            </a>
        </form>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/guest.js"></script>

<script>
    const reservationForm = document.getElementById("reservationForm");
    const reservationFormContainer = document.getElementById("reservationFormContainer");
    const createReservationButton = document.getElementById("createReservationButton");
    const noRoomMessage = document.getElementById("noRoomMessage");

    const urlParams = new URLSearchParams(window.location.search);

    const roomIdFromUrl = urlParams.get("room_id");
    const checkInFromUrl = urlParams.get("check_in_date");
    const checkOutFromUrl = urlParams.get("check_out_date");

    if (!roomIdFromUrl) {
        reservationFormContainer.classList.add("d-none");
        noRoomMessage.classList.remove("d-none");
    } else {
        document.getElementById("roomId").value = roomIdFromUrl;
    }

    if (checkInFromUrl) {
        document.getElementById("checkInDate").value = checkInFromUrl;
    }

    if (checkOutFromUrl) {
        document.getElementById("checkOutDate").value = checkOutFromUrl;
    }

    reservationForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        hideGuestError("errorMessage");
        hideGuestSuccess("successMessage");

        const successMessage = document.getElementById("successMessage");
        successMessage.innerHTML = "";

        const checkInDate = document.getElementById("checkInDate").value;
        const checkOutDate = document.getElementById("checkOutDate").value;

        if (checkOutDate <= checkInDate) {
            showGuestError(
                "errorMessage",
                "Дата выезда должна быть позже даты заезда"
            );
            return;
        }

        const data = {
            first_name: document.getElementById("firstName").value.trim(),
            last_name: document.getElementById("lastName").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            passport_number: document.getElementById("passportNumber").value.trim(),
            room_id: document.getElementById("roomId").value,
            check_in_date: checkInDate,
            check_out_date: checkOutDate
        };

        createReservationButton.disabled = true;
        createReservationButton.textContent = "Создание...";

        try {
            const result = await createGuestReservation(data);
            const payment = result.payment;

            successMessage.innerHTML = `
                <h5>Бронь успешно создана</h5>

                <p>
                    Ваша бронь сохранена. Вы можете посмотреть её на странице
                    «Мои брони» по номеру телефона.
                </p>

                <p><strong>Заезд:</strong> ${formatDate(checkInDate)}</p>
                <p><strong>Выезд:</strong> ${formatDate(checkOutDate)}</p>
                <p><strong>Сумма к оплате:</strong> ${formatMoney(payment.amount)}</p>

                <a class="btn btn-success" href="my-reservations.html">
                    Перейти к моим броням
                </a>
            `;

            successMessage.classList.remove("d-none");
            reservationForm.reset();
            reservationFormContainer.classList.add("d-none");

        } catch (error) {
            showGuestError("errorMessage", error.message);

        } finally {
            createReservationButton.disabled = false;
            createReservationButton.textContent = "Забронировать";
        }
    });
</script>

</body>
</html>
