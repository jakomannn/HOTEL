<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата брони</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Венеция</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="rooms.html">Доступные номера</a>
            <a class="nav-link" href="my-reservations.html">Мои брони</a>
            <a class="nav-link" href="../login.html">Вход сотрудника</a>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Оплата брони</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <div class="form-container">
        <p class="mb-4">
            Чтобы оплатить бронь, укажите номер телефона, который был использован
            при бронировании. После этого вы увидите свои брони и сможете оплатить нужную.
        </p>

        <form id="paymentRedirectForm">
            <div class="mb-3">
                <label for="phone" class="form-label">Номер телефона</label>
                <input
                    type="text"
                    id="phone"
                    class="form-control"
                    placeholder="+79990000000"
                    required
                >
            </div>

            <button type="submit" class="btn btn-success">
                Найти мои брони
            </button>

            <a href="rooms.html" class="btn btn-secondary">
                К доступным номерам
            </a>
        </form>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/guest.js"></script>

<script>
    const paymentRedirectForm = document.getElementById("paymentRedirectForm");
    const phoneInput = document.getElementById("phone");

    document.addEventListener("DOMContentLoaded", function () {
        const savedPhone = getSavedGuestPhone();

        if (savedPhone) {
            phoneInput.value = savedPhone;
        }
    });

    paymentRedirectForm.addEventListener("submit", function (event) {
        event.preventDefault();

        hideGuestError("errorMessage");

        const phone = phoneInput.value.trim();

        if (!phone) {
            showGuestError("errorMessage", "Введите номер телефона");
            return;
        }

        saveGuestPhone(phone);

        window.location.href = "my-reservations.html";
    });
</script>

</body>
</html>
