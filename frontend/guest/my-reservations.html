<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои брони</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Венеция</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="rooms.html">Доступные номера</a>
            <a class="nav-link active" href="my-reservations.html">Мои брони</a>
            <a class="nav-link" href="../login.html">Вход сотрудника</a>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Мои брони</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div class="form-container mb-4">
        <form id="searchReservationsForm">
            <div class="row">
                <div class="col-md-9 mb-3">
                    <label for="phone" class="form-label">Номер телефона</label>
                    <input
                        type="text"
                        id="phone"
                        class="form-control"
                        placeholder="+79990000000"
                        required
                    >
                </div>

                <div class="col-md-3 mb-3 d-flex align-items-end">
                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                        id="searchButton"
                    >
                        Показать брони
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div id="emptyBlock" class="alert alert-info d-none">
        <p class="mb-3">По этому номеру телефона брони не найдены.</p>

        <a href="rooms.html" class="btn btn-primary">
            Посмотреть доступные номера
        </a>
    </div>

    <div id="reservationsBlock" class="d-none">
        <h2 class="mb-3">Ваши брони</h2>

        <div id="reservationsList" class="row g-3"></div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/guest.js"></script>

<script>
    const searchReservationsForm = document.getElementById("searchReservationsForm");
    const searchButton = document.getElementById("searchButton");
    const reservationsBlock = document.getElementById("reservationsBlock");
    const reservationsList = document.getElementById("reservationsList");
    const emptyBlock = document.getElementById("emptyBlock");
    const phoneInput = document.getElementById("phone");

    document.addEventListener("DOMContentLoaded", async function () {
        const savedPhone = getSavedGuestPhone();

        if (savedPhone) {
            phoneInput.value = savedPhone;
            await loadGuestReservations(savedPhone);
        }
    });

    searchReservationsForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const phone = phoneInput.value.trim();

        await loadGuestReservations(phone);
    });

    async function loadGuestReservations(phone, options = {}) {
        const keepSuccessMessage = options.keepSuccessMessage === true;

        hideGuestError("errorMessage");

        if (!keepSuccessMessage) {
            hideGuestSuccess("successMessage");
        }

        reservationsList.innerHTML = "";
        reservationsBlock.classList.add("d-none");
        emptyBlock.classList.add("d-none");

        if (!phone) {
            showGuestError("errorMessage", "Введите номер телефона");
            return;
        }

        searchButton.disabled = true;
        searchButton.textContent = "Поиск...";

        try {
            const reservations = await getGuestReservationsByPhone(phone);

            if (!reservations || reservations.length === 0) {
                emptyBlock.classList.remove("d-none");
                return;
            }

            reservations.forEach(renderReservationCard);
            reservationsBlock.classList.remove("d-none");

        } catch (error) {
            showGuestError("errorMessage", error.message);

        } finally {
            searchButton.disabled = false;
            searchButton.textContent = "Показать брони";
        }
    }

    function renderReservationCard(reservation) {
        const card = document.createElement("div");
        card.className = "col-md-6";

        const canPay = reservation.can_pay && reservation.payment_id;

        card.innerHTML = `
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        Номер ${reservation.room_number}
                    </h5>

                    <p class="card-text mb-2">
                        <strong>Заезд:</strong> ${formatDate(reservation.check_in_date)}
                    </p>

                    <p class="card-text mb-2">
                        <strong>Выезд:</strong> ${formatDate(reservation.check_out_date)}
                    </p>

                    <p class="card-text mb-2">
                        <strong>Сумма:</strong> ${formatMoney(reservation.amount)}
                    </p>

                    <p class="card-text mb-3">
                        <strong>Состояние:</strong> ${reservation.display_status}
                    </p>

                    ${
                        canPay
                            ? `<button
                                    class="btn btn-success"
                                    onclick="handlePayReservation(${reservation.payment_id})"
                               >
                                    Оплатить
                               </button>`
                            : ""
                    }
                </div>
            </div>
        `;

        reservationsList.appendChild(card);
    }

    async function handlePayReservation(paymentId) {
        hideGuestError("errorMessage");
        hideGuestSuccess("successMessage");

        const confirmed = confirm("Оплатить бронь?");

        if (!confirmed) {
            return;
        }

        try {
            await payReservation(paymentId);

            const phone = phoneInput.value.trim();

            await loadGuestReservations(phone, {
                keepSuccessMessage: true
            });

            showGuestSuccess("successMessage", "Оплата успешно выполнена.");

        } catch (error) {
            showGuestError("errorMessage", error.message);
        }
    }
</script>

</body>
</html>
