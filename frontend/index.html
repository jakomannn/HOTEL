<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Венеция</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Венеция</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="guest/rooms.html">Доступные номера</a>
            <a class="nav-link" href="guest/my-reservations.html">Мои брони</a>
            <a class="nav-link" href="login.html" id="loginLink">Вход сотрудника</a>

            <button
                class="btn btn-outline-light btn-sm d-none ms-2"
                id="logoutButton"
                type="button"
            >
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-5">

    <div id="userInfo" class="alert alert-info d-none"></div>

    <div class="p-5 mb-4 bg-light rounded-3">
        <div class="container-fluid py-4">
            <h1 class="display-5 fw-bold">Гостиница «Венеция»</h1>

            <p class="col-md-8 fs-5">
                Добро пожаловать в гостиницу «Венеция».
            </p>

            <a href="guest/rooms.html" class="btn btn-primary btn-lg">
                Доступные номера
            </a>
        </div>
    </div>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

<script>
    const loginLink = document.getElementById("loginLink");
    const logoutButton = document.getElementById("logoutButton");
    const userInfo = document.getElementById("userInfo");

    document.addEventListener("DOMContentLoaded", async function () {
        if (!getToken()) {
            return;
        }

        try {
            const user = await loadCurrentUser();

            loginLink.classList.add("d-none");
            logoutButton.classList.remove("d-none");

            userInfo.textContent =
                `Вы вошли как ${user.first_name} ${user.last_name}`;
            userInfo.classList.remove("d-none");

        } catch (error) {
            removeToken();
        }
    });

    logoutButton.addEventListener("click", function () {
        logout();
    });
</script>

</body>
</html>
