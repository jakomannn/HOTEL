<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заселение и выезд</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="reservations.html">Брони</a>
            <a class="nav-link" href="clients.html">Клиенты</a>
            <a class="nav-link" href="payments.html">Оплаты</a>
            <a class="nav-link active" href="check-ins.html">Заселение</a>
            <a class="nav-link" href="stay-history.html">История</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Заселение и выезд</h1>

        <button class="btn btn-primary" onclick="loadCheckIns()">
            Обновить
        </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID заселения</th>
            <th>ID брони</th>
            <th>ID сотрудника</th>
            <th>Время заселения</th>
            <th>Время выезда</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody id="checkInsTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/manager.js"></script>

<script>
    requireRole(["manager", "admin"]);

    const checkInsTableBody = document.getElementById("checkInsTableBody");

    function renderCheckInRow(checkIn) {
        const isActive = checkIn.check_out_time === null;

        const status = isActive ? "active" : "completed";
        const statusClass = isActive ? "status-occupied" : "status-completed";

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${checkIn.check_in_id}</td>
            <td>${checkIn.reservation_id}</td>
            <td>${checkIn.employee_id}</td>
            <td>${formatDateTime(checkIn.check_in_time)}</td>
            <td>${formatDateTime(checkIn.check_out_time)}</td>
            <td>
                <span class="status-badge ${statusClass}">
                    ${status}
                </span>
            </td>
            <td>
                ${
                    isActive
                        ? `<button
                                class="btn btn-sm btn-warning"
                                onclick="handleCheckOut(${checkIn.check_in_id})"
                           >
                                Выселить
                           </button>`
                        : "-"
                }
            </td>
        `;

        checkInsTableBody.appendChild(row);
    }

    async function loadCheckIns() {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        checkInsTableBody.innerHTML = "";

        try {
            const checkIns = await getCheckIns();

        const activeCheckIns = checkIns.filter(function (checkIn) {
            return checkIn.check_out_time === null;
        });

        if (!activeCheckIns || activeCheckIns.length === 0) {
            checkInsTableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center">
                        Активных заселений нет
                    </td>
                </tr>
            `;
            return;
        }

        activeCheckIns.forEach(renderCheckInRow);

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    async function handleCheckOut(checkInId) {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        const confirmed = confirm("Зарегистрировать выезд гостя?");

        if (!confirmed) {
            return;
        }

        try {
            await checkOut(checkInId);
            showManagerSuccess("successMessage", "Выезд успешно зарегистрирован.");
            await loadCheckIns();

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    loadCheckIns();
</script>

</body>
</html>
