<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплаты</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="reservations.html">Брони</a>
            <a class="nav-link" href="clients.html">Клиенты</a>
            <a class="nav-link active" href="payments.html">Оплаты</a>
            <a class="nav-link" href="check-ins.html">Заселение</a>
            <a class="nav-link" href="stay-history.html">История</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Оплаты</h1>

        <button class="btn btn-primary" onclick="loadPayments()">
            Обновить
        </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID оплаты</th>
            <th>ID брони</th>
            <th>Сумма</th>
            <th>Метод</th>
            <th>Статус</th>
            <th>Дата создания</th>
            <th>Дата оплаты</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody id="paymentsTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/manager.js"></script>

<script>
    requireRole(["manager", "admin"]);

    const paymentsTableBody = document.getElementById("paymentsTableBody");

    async function loadPayments() {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        paymentsTableBody.innerHTML = "";

        try {
            const payments = await getPayments();

            if (!payments || payments.length === 0) {
                paymentsTableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center">
                            Оплаты не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            payments.forEach(function (payment) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${payment.payment_id}</td>
                    <td>${payment.reservation_id}</td>
                    <td>${formatManagerMoney(payment.amount)}</td>
                    <td>${payment.method || "-"}</td>
                    <td>
                        <span class="${getManagerStatusClass(payment.status)}">
                            ${payment.status}
                        </span>
                    </td>
                    <td>${formatDateTime(payment.created_at)}</td>
                    <td>${formatDateTime(payment.payment_date)}</td>
                    <td>
                        ${
                            payment.status === "pending"
                                ? `<button
                                        class="btn btn-sm btn-success mb-1"
                                        onclick="handleConfirmPayment(${payment.payment_id})"
                                   >
                                        Подтвердить оплату
                                   </button>`
                                : ""
                        }

                        ${
                            payment.status === "pending"
                                ? `<button
                                        class="btn btn-sm btn-outline-danger mb-1"
                                        onclick="handleFailPayment(${payment.payment_id})"
                                   >
                                        Сбой оплаты
                                   </button>`
                                : ""
                        }

                        ${
                            payment.status !== "pending"
                                ? "-"
                                : ""
                        }
                    </td>
                `;

                paymentsTableBody.appendChild(row);
            });

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    async function handleConfirmPayment(paymentId) {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        try {
            await confirmPayment(paymentId);
            showManagerSuccess("successMessage", "Оплата подтверждена.");
            await loadPayments();

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    async function handleFailPayment(paymentId) {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        const confirmed = confirm("Отметить оплату как failed?");

        if (!confirmed) {
            return;
        }

        try {
            await failPayment(paymentId);
            showManagerSuccess("successMessage", "Оплата отмечена как failed.");
            await loadPayments();

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    loadPayments();
</script>

</body>
</html>
