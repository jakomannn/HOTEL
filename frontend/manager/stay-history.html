<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История проживания</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="reservations.html">Брони</a>
            <a class="nav-link" href="clients.html">Клиенты</a>
            <a class="nav-link" href="payments.html">Оплаты</a>
            <a class="nav-link" href="check-ins.html">Заселение</a>
            <a class="nav-link active" href="stay-history.html">История</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">История проживания</h1>

        <button class="btn btn-primary" onclick="loadStayHistory()">
            Обновить
        </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID истории</th>
            <th>ID брони</th>
            <th>ID заселения</th>
            <th>ID клиента</th>
            <th>ID номера</th>
            <th>Дата заезда</th>
            <th>Дата выезда</th>
            <th>Ночей</th>
            <th>Стоимость</th>
        </tr>
        </thead>

        <tbody id="stayHistoryTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/manager.js"></script>

<script>
    requireRole(["manager", "admin"]);

    const stayHistoryTableBody = document.getElementById("stayHistoryTableBody");

    function renderStayHistoryRow(record) {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${record.history_id}</td>
            <td>${record.reservation_id || "-"}</td>
            <td>${record.check_in_id || "-"}</td>
            <td>${record.client_id}</td>
            <td>${record.room_id}</td>
            <td>${formatDateTime(record.check_in_date)}</td>
            <td>${formatDateTime(record.check_out_date)}</td>
            <td>${record.total_nights}</td>
            <td>${formatManagerMoney(record.total_cost)}</td>
        `;

        stayHistoryTableBody.appendChild(row);
    }

    async function loadStayHistory() {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        stayHistoryTableBody.innerHTML = "";

        try {
            const records = await getStayHistory();

            if (!records || records.length === 0) {
                stayHistoryTableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center">
                            История проживания не найдена
                        </td>
                    </tr>
                `;
                return;
            }

            records.forEach(renderStayHistoryRow);

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    loadStayHistory();
</script>

</body>
</html>
