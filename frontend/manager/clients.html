<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клиенты</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="reservations.html">Брони</a>
            <a class="nav-link active" href="clients.html">Клиенты</a>
            <a class="nav-link" href="payments.html">Оплаты</a>
            <a class="nav-link" href="check-ins.html">Заселение</a>
            <a class="nav-link" href="stay-history.html">История</a>
            <a class="nav-link" href="rooms.html">Номера</a>

            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Клиенты</h1>

        <button class="btn btn-primary" onclick="loadClients()">
            Обновить
        </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID клиента</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>Паспорт</th>
            <th>Дата создания</th>
        </tr>
        </thead>

        <tbody id="clientsTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/manager.js"></script>

<script>
    requireRole(["manager", "admin"]);

    const clientsTableBody = document.getElementById("clientsTableBody");

    async function loadClients() {
        hideManagerError("errorMessage");
        hideManagerSuccess("successMessage");

        clientsTableBody.innerHTML = "";

        try {
            const clients = await getClients();

            if (!clients || clients.length === 0) {
                clientsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center">
                            Клиенты не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            clients.forEach(function (client) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${client.client_id}</td>
                    <td>${client.first_name}</td>
                    <td>${client.last_name}</td>
                    <td>${client.email}</td>
                    <td>${client.phone}</td>
                    <td>${client.passport_number}</td>
                    <td>${formatDateTime(client.created_at)}</td>
                `;

                clientsTableBody.appendChild(row);
            });

        } catch (error) {
            showManagerError("errorMessage", error.message);
        }
    }

    loadClients();
</script>

</body>
</html>
