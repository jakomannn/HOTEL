<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Номера</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="employees.html">Сотрудники</a>
            <a class="nav-link" href="positions.html">Должности</a>
            <a class="nav-link" href="room-categories.html">Категории</a>
            <a class="nav-link active" href="rooms.html">Номера</a>
            <a class="nav-link" href="audit-logs.html">Журнал действий</a>

            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Номера</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div class="form-container mb-4">
        <h4 id="formTitle" class="mb-3">Добавить номер</h4>

        <form id="roomForm">
            <input type="hidden" id="roomId">

            <div class="mb-3">
                <label for="roomNumber" class="form-label">Номер комнаты</label>
                <input
                    type="number"
                    id="roomNumber"
                    class="form-control"
                    min="1"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="categoryId" class="form-label">Категория</label>
                <select id="categoryId" class="form-select" required>
                    <option value="">Выберите категорию</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Статус</label>
                <select id="status" class="form-select" required>
                    <option value="free">free</option>
                    <option value="occupied">occupied</option>
                    <option value="cleaning">cleaning</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>

            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                Очистить
            </button>
        </form>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Список номеров</h4>

        <button class="btn btn-primary" onclick="loadRooms()">
            Обновить
        </button>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID номера</th>
            <th>Номер</th>
            <th>ID категории</th>
            <th>Категория</th>
            <th>Цена за ночь</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody id="roomsTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
    requireRole(["admin"]);

    const roomForm = document.getElementById("roomForm");
    const roomsTableBody = document.getElementById("roomsTableBody");
    const categorySelect = document.getElementById("categoryId");

    let categoriesCache = [];

    roomForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        const roomId = document.getElementById("roomId").value;

        const data = {
            room_number: document.getElementById("roomNumber").value,
            category_id: document.getElementById("categoryId").value,
            status: document.getElementById("status").value
        };

        try {
            if (roomId) {
                await updateRoom(roomId, data);
                showAdminSuccess("successMessage", "Номер обновлён.");
            } else {
                await createRoom(data);
                showAdminSuccess("successMessage", "Номер создан.");
            }

            resetForm();
            await loadRooms();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    });

    async function loadCategoriesForSelect() {
        categorySelect.innerHTML = `
            <option value="">Выберите категорию</option>
        `;

        try {
            categoriesCache = await getRoomCategories();

            categoriesCache.forEach(function (category) {
                const option = document.createElement("option");

                option.value = category.category_id;
                option.textContent = `${category.category_id} — ${category.name}`;

                categorySelect.appendChild(option);
            });

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function getCategoryById(categoryId) {
        return categoriesCache.find(function (category) {
            return Number(category.category_id) === Number(categoryId);
        }) || null;
    }

    async function loadRooms() {
        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        roomsTableBody.innerHTML = "";

        try {
            const rooms = await getAdminRooms();

            if (!rooms || rooms.length === 0) {
                roomsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center">
                            Номера не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            rooms.forEach(function (room) {
                const category = getCategoryById(room.category_id);
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${room.room_id}</td>
                    <td>${room.room_number}</td>
                    <td>${room.category_id}</td>
                    <td>${category ? category.name : "-"}</td>
                    <td>${category ? formatAdminMoney(category.price_per_night) : "-"}</td>
                    <td>
                        <span class="${getAdminStatusClass(room.status)}">
                            ${room.status}
                        </span>
                    </td>
                    <td>
                        <button
                            class="btn btn-sm btn-warning mb-1"
                            onclick='editRoom(${JSON.stringify(room)})'
                        >
                            Изменить
                        </button>

                        <button
                            class="btn btn-sm btn-danger mb-1"
                            onclick="handleDeleteRoom(${room.room_id})"
                        >
                            Удалить
                        </button>
                    </td>
                `;

                roomsTableBody.appendChild(row);
            });

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function editRoom(room) {
        document.getElementById("formTitle").textContent = "Редактировать номер";
        document.getElementById("roomId").value = room.room_id;
        document.getElementById("roomNumber").value = room.room_number;
        document.getElementById("categoryId").value = room.category_id;
        document.getElementById("status").value = room.status;

        window.scrollTo(0, 0);
    }

    async function handleDeleteRoom(roomId) {
        const confirmed = confirm("Удалить этот номер?");

        if (!confirmed) {
            return;
        }

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        try {
            await deleteRoom(roomId);
            showAdminSuccess("successMessage", "Номер удалён.");
            await loadRooms();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function resetForm() {
        document.getElementById("formTitle").textContent = "Добавить номер";
        document.getElementById("roomId").value = "";

        roomForm.reset();
    }

    async function initPage() {
        await loadCategoriesForSelect();
        await loadRooms();
    }

    initPage();
</script>

</body>
</html>
