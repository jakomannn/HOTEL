<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории номеров</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="employees.html">Сотрудники</a>
            <a class="nav-link" href="positions.html">Должности</a>
            <a class="nav-link active" href="room-categories.html">Категории</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <a class="nav-link" href="audit-logs.html">Журнал действий</a>

            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Категории номеров</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div class="form-container mb-4">
        <h4 id="formTitle" class="mb-3">Добавить категорию</h4>

        <form id="categoryForm">
            <input type="hidden" id="categoryId">

            <div class="mb-3">
                <label for="name" class="form-label">Название категории</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label for="maxGuests" class="form-label">Максимум гостей</label>
                <input
                    type="number"
                    id="maxGuests"
                    class="form-control"
                    min="1"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="pricePerNight" class="form-label">Цена за ночь</label>
                <input
                    type="number"
                    id="pricePerNight"
                    class="form-control"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>

            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                Очистить
            </button>
        </form>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Список категорий</h4>

        <button class="btn btn-primary" onclick="loadCategories()">
            Обновить
        </button>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Максимум гостей</th>
            <th>Цена за ночь</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody id="categoriesTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
    requireRole(["admin"]);

    const categoryForm = document.getElementById("categoryForm");
    const categoriesTableBody = document.getElementById("categoriesTableBody");

    categoryForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        const categoryId = document.getElementById("categoryId").value;

        const data = {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim(),
            max_guests: document.getElementById("maxGuests").value,
            price_per_night: document.getElementById("pricePerNight").value
        };

        try {
            if (categoryId) {
                await updateRoomCategory(categoryId, data);
                showAdminSuccess("successMessage", "Категория обновлена.");
            } else {
                await createRoomCategory(data);
                showAdminSuccess("successMessage", "Категория создана.");
            }

            resetForm();
            await loadCategories();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    });

    async function loadCategories() {
        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        categoriesTableBody.innerHTML = "";

        try {
            const categories = await getRoomCategories();

            if (!categories || categories.length === 0) {
                categoriesTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">
                            Категории не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            categories.forEach(function (category) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${category.category_id}</td>
                    <td>${category.name}</td>
                    <td>${category.description || "-"}</td>
                    <td>${category.max_guests}</td>
                    <td>${formatAdminMoney(category.price_per_night)}</td>
                    <td>
                        <button
                            class="btn btn-sm btn-warning mb-1"
                            onclick='editCategory(${JSON.stringify(category)})'
                        >
                            Изменить
                        </button>

                        <button
                            class="btn btn-sm btn-danger mb-1"
                            onclick="handleDeleteCategory(${category.category_id})"
                        >
                            Удалить
                        </button>
                    </td>
                `;

                categoriesTableBody.appendChild(row);
            });

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function editCategory(category) {
        document.getElementById("formTitle").textContent = "Редактировать категорию";
        document.getElementById("categoryId").value = category.category_id;
        document.getElementById("name").value = category.name;
        document.getElementById("description").value = category.description || "";
        document.getElementById("maxGuests").value = category.max_guests;
        document.getElementById("pricePerNight").value = category.price_per_night;

        window.scrollTo(0, 0);
    }

    async function handleDeleteCategory(categoryId) {
        const confirmed = confirm("Удалить эту категорию?");

        if (!confirmed) {
            return;
        }

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        try {
            await deleteRoomCategory(categoryId);
            showAdminSuccess("successMessage", "Категория удалена.");
            await loadCategories();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function resetForm() {
        document.getElementById("formTitle").textContent = "Добавить категорию";
        document.getElementById("categoryId").value = "";

        categoryForm.reset();
    }

    loadCategories();
</script>

</body>
</html>
