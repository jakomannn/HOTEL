<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Должности</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="employees.html">Сотрудники</a>
            <a class="nav-link active" href="positions.html">Должности</a>
            <a class="nav-link" href="room-categories.html">Категории</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <a class="nav-link" href="audit-logs.html">Журнал действий</a>

            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Должности</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div class="form-container mb-4">
        <h4 id="formTitle" class="mb-3">Добавить должность</h4>

        <form id="positionForm">
            <input type="hidden" id="positionId">

            <div class="mb-3">
                <label for="name" class="form-label">Название должности</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>

            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                Очистить
            </button>
        </form>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Список должностей</h4>

        <button class="btn btn-primary" onclick="loadPositions()">
            Обновить
        </button>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody id="positionsTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
    requireRole(["admin"]);

    const positionForm = document.getElementById("positionForm");
    const positionsTableBody = document.getElementById("positionsTableBody");

    positionForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        const positionId = document.getElementById("positionId").value;

        const data = {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim()
        };

        try {
            if (positionId) {
                await updatePosition(positionId, data);
                showAdminSuccess("successMessage", "Должность обновлена.");
            } else {
                await createPosition(data);
                showAdminSuccess("successMessage", "Должность создана.");
            }

            resetForm();
            await loadPositions();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    });

    async function loadPositions() {
        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        positionsTableBody.innerHTML = "";

        try {
            const positions = await getPositions();

            if (!positions || positions.length === 0) {
                positionsTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center">
                            Должности не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            positions.forEach(function (position) {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${position.position_id}</td>
                    <td>${position.name}</td>
                    <td>${position.description || "-"}</td>
                    <td>
                        <button
                            class="btn btn-sm btn-warning mb-1"
                            onclick='editPosition(${JSON.stringify(position)})'
                        >
                            Изменить
                        </button>

                        <button
                            class="btn btn-sm btn-danger mb-1"
                            onclick="handleDeletePosition(${position.position_id})"
                        >
                            Удалить
                        </button>
                    </td>
                `;

                positionsTableBody.appendChild(row);
            });

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function editPosition(position) {
        document.getElementById("formTitle").textContent = "Редактировать должность";
        document.getElementById("positionId").value = position.position_id;
        document.getElementById("name").value = position.name;
        document.getElementById("description").value = position.description || "";

        window.scrollTo(0, 0);
    }

    async function handleDeletePosition(positionId) {
        const confirmed = confirm("Удалить эту должность?");

        if (!confirmed) {
            return;
        }

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        try {
            await deletePosition(positionId);
            showAdminSuccess("successMessage", "Должность удалена.");
            await loadPositions();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function resetForm() {
        document.getElementById("formTitle").textContent = "Добавить должность";
        document.getElementById("positionId").value = "";
        positionForm.reset();
    }

    loadPositions();
</script>

</body>
</html>
