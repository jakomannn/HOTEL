<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сотрудники</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="employees.html">Сотрудники</a>
            <a class="nav-link" href="positions.html">Должности</a>
            <a class="nav-link" href="room-categories.html">Категории</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <a class="nav-link" href="audit-logs.html">Журнал действий</a>

            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">
    <h1 class="page-title">Сотрудники</h1>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div class="form-container mb-4">
        <h4 id="formTitle" class="mb-3">Добавить сотрудника</h4>

        <form id="employeeForm">
            <input type="hidden" id="employeeId">

            <div class="mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input type="text" id="firstName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input type="text" id="lastName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Телефон</label>
                <input type="text" id="phone" class="form-control" required>
            </div>

            <div class="mb-3" id="passwordBlock">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" class="form-control">
            </div>

            <div class="mb-3">
                <label for="position" class="form-label">Должность</label>
                <select id="position" class="form-select" required>
                    <option value="">Выберите должность</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Статус</label>
                <select id="status" class="form-select" required>
                    <option value="true">Активен</option>
                    <option value="false">Неактивен</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>

            <button type="button" class="btn btn-secondary" onclick="resetForm()">
                Очистить
            </button>
        </form>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Список сотрудников</h4>

        <button class="btn btn-primary" onclick="loadEmployees()">
            Обновить
        </button>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Фамилия</th>
            <th>Email</th>
            <th>Телефон</th>
            <th>ID должности</th>
            <th>Должность</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>

        <tbody id="employeesTableBody"></tbody>
    </table>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
    requireRole(["admin"]);

    const employeeForm = document.getElementById("employeeForm");
    const employeesTableBody = document.getElementById("employeesTableBody");
    const positionSelect = document.getElementById("position");

    let positionsCache = [];

    employeeForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        const employeeId = document.getElementById("employeeId").value;

        const data = {
            first_name: document.getElementById("firstName").value.trim(),
            last_name: document.getElementById("lastName").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            password: document.getElementById("password").value,
            position_id: document.getElementById("position").value,
            status: document.getElementById("status").value === "true"
        };

        try {
            if (employeeId) {
                await updateEmployee(employeeId, data);
                showAdminSuccess("successMessage", "Сотрудник обновлён.");
            } else {
                if (!data.password) {
                    showAdminError(
                        "errorMessage",
                        "Для нового сотрудника нужно указать пароль."
                    );
                    return;
                }

                await createEmployee(data);
                showAdminSuccess("successMessage", "Сотрудник создан.");
            }

            resetForm();
            await loadEmployees();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    });

    async function loadPositionsForSelect() {
        positionSelect.innerHTML = `
            <option value="">Выберите должность</option>
        `;

        try {
            positionsCache = await getPositions();

            positionsCache.forEach(function (position) {
                const option = document.createElement("option");

                option.value = position.position_id;
                option.textContent = `${position.position_id} — ${position.name}`;

                positionSelect.appendChild(option);
            });

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function getPositionName(positionId) {
        const position = positionsCache.find(function (item) {
            return Number(item.position_id) === Number(positionId);
        });

        return position ? position.name : "-";
    }

    async function loadEmployees() {
        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        employeesTableBody.innerHTML = "";

        try {
            const employees = await getEmployees();

            if (!employees || employees.length === 0) {
                employeesTableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center">
                            Сотрудники не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            employees.forEach(function (employee) {
                const row = document.createElement("tr");
                const positionName = getPositionName(employee.position_id);

                row.innerHTML = `
                    <td>${employee.employee_id}</td>
                    <td>${employee.first_name}</td>
                    <td>${employee.last_name}</td>
                    <td>${employee.email}</td>
                    <td>${employee.phone}</td>
                    <td>${employee.position_id}</td>
                    <td>${positionName}</td>
                    <td>
                        <span class="${getAdminStatusClass(employee.status)}">
                            ${formatAdminStatus(employee.status)}
                        </span>
                    </td>
                    <td>
                        <button
                            class="btn btn-sm btn-warning mb-1"
                            onclick='editEmployee(${JSON.stringify(employee)})'
                        >
                            Изменить
                        </button>

                        <button
                            class="btn btn-sm btn-danger mb-1"
                            onclick="handleDeleteEmployee(${employee.employee_id})"
                        >
                            Удалить
                        </button>
                    </td>
                `;

                employeesTableBody.appendChild(row);
            });

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function editEmployee(employee) {
        document.getElementById("formTitle").textContent = "Редактировать сотрудника";

        document.getElementById("employeeId").value = employee.employee_id;
        document.getElementById("firstName").value = employee.first_name;
        document.getElementById("lastName").value = employee.last_name;
        document.getElementById("email").value = employee.email;
        document.getElementById("phone").value = employee.phone;
        document.getElementById("password").value = "";
        document.getElementById("position").value = employee.position_id;
        document.getElementById("status").value = String(employee.status);

        document.getElementById("passwordBlock").classList.add("d-none");

        window.scrollTo(0, 0);
    }

    async function handleDeleteEmployee(employeeId) {
        const confirmed = confirm("Удалить этого сотрудника?");

        if (!confirmed) {
            return;
        }

        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        try {
            await deleteEmployee(employeeId);
            showAdminSuccess("successMessage", "Сотрудник удалён.");
            await loadEmployees();

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    function resetForm() {
        document.getElementById("formTitle").textContent = "Добавить сотрудника";
        document.getElementById("employeeId").value = "";
        document.getElementById("passwordBlock").classList.remove("d-none");

        employeeForm.reset();
    }

    async function initPage() {
        await loadPositionsForSelect();
        await loadEmployees();
    }

    initPage();
</script>

</body>
</html>
