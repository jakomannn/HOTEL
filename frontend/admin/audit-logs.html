<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Журнал действий</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="../index.html">Hotel IS</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="employees.html">Сотрудники</a>
            <a class="nav-link" href="positions.html">Должности</a>
            <a class="nav-link" href="room-categories.html">Категории</a>
            <a class="nav-link" href="rooms.html">Номера</a>
            <a class="nav-link active" href="audit-logs.html">Журнал действий</a>

            <button class="btn btn-outline-light btn-sm ms-3" onclick="logout()">
                Выйти
            </button>
        </div>
    </div>
</nav>

<main class="container-fluid mt-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0">Журнал действий</h1>

        <button class="btn btn-primary" onclick="loadAuditLogs()">
            Обновить
        </button>
    </div>

    <div id="errorMessage" class="alert alert-danger d-none"></div>
    <div id="successMessage" class="alert alert-success d-none"></div>

    <div class="form-container mb-4">
        <form id="auditFilterForm">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label for="tableName" class="form-label">Таблица</label>
                    <input
                        type="text"
                        id="tableName"
                        class="form-control"
                        placeholder="Например: rooms"
                    >
                </div>

                <div class="col-md-3 mb-3">
                    <label for="actionType" class="form-label">Тип действия</label>
                    <select id="actionType" class="form-select">
                        <option value="">Все</option>
                        <option value="INSERT">INSERT</option>
                        <option value="UPDATE">UPDATE</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                </div>

                <div class="col-md-3 mb-3">
                    <label for="employeeId" class="form-label">ID сотрудника</label>
                    <input
                        type="number"
                        id="employeeId"
                        class="form-control"
                        placeholder="Например: 2"
                    >
                </div>

                <div class="col-md-2 mb-3">
                    <label for="limit" class="form-label">Лимит</label>
                    <input
                        type="number"
                        id="limit"
                        class="form-control"
                        value="100"
                        min="1"
                        max="500"
                    >
                </div>

                <div class="col-md-1 mb-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-dark w-100">
                        Найти
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Сотрудник</th>
                <th>Роль</th>
                <th>Действие</th>
                <th>Таблица</th>
                <th>ID записи</th>
                <th>IP</th>
                <th>Дата</th>
                <th>Старые данные</th>
                <th>Новые данные</th>
            </tr>
            </thead>

            <tbody id="auditLogsTableBody"></tbody>
        </table>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>

<script>
    requireRole(["admin"]);

    const auditFilterForm = document.getElementById("auditFilterForm");
    const auditLogsTableBody = document.getElementById("auditLogsTableBody");

    auditFilterForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        await loadAuditLogs();
    });

    function formatJsonCell(value) {
        if (!value) {
            return "-";
        }

        return JSON.stringify(value, null, 2);
    }

    function getActionBadgeClass(actionType) {
        if (actionType === "INSERT") {
            return "status-badge status-free";
        }

        if (actionType === "UPDATE") {
            return "status-badge status-pending";
        }

        if (actionType === "DELETE") {
            return "status-badge status-cancelled";
        }

        return "status-badge";
    }

    function createTextCell(text) {
        const cell = document.createElement("td");
        cell.textContent = text ?? "-";
        return cell;
    }

    function createBadgeCell(text, className) {
        const cell = document.createElement("td");
        const span = document.createElement("span");

        span.className = className;
        span.textContent = text || "-";

        cell.appendChild(span);

        return cell;
    }

    function createJsonCell(value) {
        const cell = document.createElement("td");

        if (!value) {
            cell.textContent = "-";
            return cell;
        }

        const pre = document.createElement("pre");

        pre.className = "mb-0 small";
        pre.style.maxWidth = "350px";
        pre.style.maxHeight = "160px";
        pre.style.overflow = "auto";
        pre.textContent = formatJsonCell(value);

        cell.appendChild(pre);

        return cell;
    }

    function renderAuditLogRow(log) {
        const row = document.createElement("tr");

        row.appendChild(createTextCell(log.audit_log_id));
        row.appendChild(createTextCell(log.employee_id));
        row.appendChild(createTextCell(log.employee_role));

        row.appendChild(
            createBadgeCell(
                log.action_type,
                getActionBadgeClass(log.action_type)
            )
        );

        row.appendChild(createTextCell(log.table_name));
        row.appendChild(createTextCell(log.record_id));
        row.appendChild(createTextCell(log.request_ip));
        row.appendChild(createTextCell(formatAdminDateTime(log.created_at)));
        row.appendChild(createJsonCell(log.old_data));
        row.appendChild(createJsonCell(log.new_data));

        auditLogsTableBody.appendChild(row);
    }

    async function loadAuditLogs() {
        hideAdminError("errorMessage");
        hideAdminSuccess("successMessage");

        auditLogsTableBody.innerHTML = "";

        const filters = {
            table_name: document.getElementById("tableName").value.trim(),
            action_type: document.getElementById("actionType").value,
            employee_id: document.getElementById("employeeId").value,
            limit: document.getElementById("limit").value || 100
        };

        try {
            const logs = await getAuditLogs(filters);

            if (!logs || logs.length === 0) {
                auditLogsTableBody.innerHTML = `
                    <tr>
                        <td colspan="10" class="text-center">
                            Записи журнала не найдены
                        </td>
                    </tr>
                `;
                return;
            }

            logs.forEach(renderAuditLogRow);

        } catch (error) {
            showAdminError("errorMessage", error.message);
        }
    }

    loadAuditLogs();
</script>

</body>
</html>
